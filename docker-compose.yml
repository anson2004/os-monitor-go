services:
  osmonitor:
    build: .
    image: osmonitor:latest
    container_name: osmonitor
    ports:
      - "8080:8080"
    environment:
      OSMONITOR_INTERVAL: 5s
    # Mount the host's procfs/sysfs read-only so the container reports the
    # host's CPU, memory, load and sensors instead of its own cgroup view.
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc:/host/etc:ro
    pid: host
    restart: unless-stopped

  ui:
    build: ./ui
    image: osmonitor-ui:latest
    container_name: osmonitor-ui
    ports:
      - "3000:3000"
    environment:
      NUXT_API_URL: http://osmonitor:8080
    depends_on:
      - osmonitor
    restart: unless-stopped
